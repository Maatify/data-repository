name: Run Repository Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GH_START_ISO: ${{ github.event.head_commit.timestamp }}
      APP_ENV: testing

      # Redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASS: ""
      REDIS_MAIN_DSN: "redis://127.0.0.1:6379"
      REDIS_QUEUE_DSN: "redis://127.0.0.1:6379"
      REDIS_SESSIONS_DSN: "redis://127.0.0.1:6379/2"
      REDIS_CACHE_DSN: "redis://127.0.0.1:6379/2"
      REDIS_ANALYTICS_DSN: "redis://127.0.0.1:6380"

      # Mongo
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: 27017
      MONGO_USER: ""
      MONGO_PASS: ""
      MONGO_DB: maatify
      MONGO_AUTH_SOURCE: admin
      MONGO_MAIN_DSN: "mongodb://127.0.0.1:27017/maatify"
      MONGO_LOGS_DSN: "mongodb://127.0.0.1:27017/logs"
      MONGO_ACTIVITY_DSN: "mongodb://127.0.0.1:27017/activity"

      # MySQL
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: root
      MYSQL_DB: maatify_dev
      MYSQL_DRIVER: dbal

      MYSQL_DSN: "mysql:host=127.0.0.1;dbname=maatify_dev;charset=utf8mb4"
      MYSQL_MAIN_DSN: "mysql:host=127.0.0.1;dbname=maatify_main;charset=utf8mb4"
      MYSQL_MAIN_USER: root
      MYSQL_MAIN_PASS: root
      MYSQL_DEV_DSN: "mysql:host=127.0.0.1;dbname=maatify_dev;charset=utf8mb4"
      MYSQL_BILLING_DSN: "mysql:host=127.0.0.1;dbname=maatify_billing;charset=utf8mb4"
      MYSQL_LOGS_DSN: "mysql://root:root@127.0.0.1:3306/maatify_logs"
      MYSQL_LOGS_DRIVER: dbal

      # Registry (phase 13)
      DB_REGISTRY_PATH: tests/fixtures/database_registry.json

    services:
      redis:
        image: redis:7
        ports: [ "6379:6379" ]

      mongo:
        image: mongo:7
        ports: [ "27017:27017" ]

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maatify_dev
          MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - "3306:3306"

    steps:
      # ---------------------------------------------
      # 1) Checkout
      # ---------------------------------------------
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------
      # 2) PHP Setup
      # ---------------------------------------------
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: mbstring, intl, pdo, pdo_mysql, redis, mongodb
          tools: composer, phpstan

      # ---------------------------------------------
      # 3) Install Dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ---------------------------------------------
      # 4) Regenerate Autoload (CRITICAL)
      # ---------------------------------------------
      - name: Rebuild Autoload
        run: composer dump-autoload --optimize

      # ---------------------------------------------
      # 4.5) Install jq (required for Telegram JSON formatting)
      # ---------------------------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # ---------------------------------------------
      # 5) Debug Services (optional)
      # ---------------------------------------------
      - name: 🔍 Debug Connections
        run: |
          echo "Environment: $APP_ENV"
          echo "Checking Redis..."
          redis-cli -h $REDIS_HOST ping || echo "Redis not responding"
          echo "Checking MySQL..."
          mysql -h $MYSQL_HOST -u$MYSQL_USER -p$MYSQL_PASS -e "SELECT VERSION();" || echo "MySQL not responding"
          echo "Checking Mongo..."
          mongo --host $MONGO_HOST --port $MONGO_PORT --eval "db.runCommand({ ping: 1 })" || echo "Mongo not responding"
        continue-on-error: true

      # ---------------------------------------------
      # 6) Wait for MySQL
      # ---------------------------------------------
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."
          for i in {1..25}; do
            if mysqladmin ping -h $MYSQL_HOST --silent; then
              echo "MySQL ready!"
              break
            fi
            echo "Still waiting..."
            sleep 2
          done

      # ---------------------------------------------
      # 7) Create Required Databases
      # ---------------------------------------------
      - name: Init MySQL databases
        run: |
          mysql -h $MYSQL_HOST -u$MYSQL_USER -p$MYSQL_PASS \
            -e "CREATE DATABASE IF NOT EXISTS maatify_main;"
          mysql -h $MYSQL_HOST -u$MYSQL_USER -p$MYSQL_PASS \
            -e "CREATE DATABASE IF NOT EXISTS maatify_logs;"
          mysql -h $MYSQL_HOST -u$MYSQL_USER -p$MYSQL_PASS \
            -e "CREATE DATABASE IF NOT EXISTS maatify_dev;"
          mysql -h $MYSQL_HOST -u$MYSQL_USER -p$MYSQL_PASS \
            -e "CREATE DATABASE IF NOT EXISTS maatify;"

      # ---------------------------------------------
      # 8) Run PHPStan (non-blocking)
      # ---------------------------------------------
      - name: Run PHPStan
        id: phpstan
        run: |
          set +e
          composer analyse > phpstan.log
          EXIT_CODE=$?
          ERRORS=$(grep -Eo "Found [0-9]+ errors" phpstan.log | grep -Eo "[0-9]+")
          if [ -z "$ERRORS" ]; then ERRORS=0; fi

          echo "phpstan_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "phpstan_errors=$ERRORS" >> $GITHUB_OUTPUT

          echo "PHPStan completed. Errors: $ERRORS"

      # ---------------------------------------------
      # 9) Run PHPUnit
      # ---------------------------------------------
      - name: 🧪 Run PHPUnit
        id: tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover coverage.xml | tee phpunit.log
        continue-on-error: true

      - name: Install bc
        run: sudo apt-get install -y bc

      - name: Extract Coverage %
        id: coverage
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Coverage file not found! Setting coverage to 0"
            echo "coverage=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          COV=$(grep -oPm1 "(?<=line-rate=\")\d+\.\d+" coverage.xml || true)

          if [ -z "$COV" ]; then
            echo "No coverage value found. Setting coverage to 0"
            echo "coverage=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          PERCENT=$(printf "%.0f" "$(echo "$COV * 100" | bc)")
          echo "Coverage: $PERCENT%"
          echo "coverage=$PERCENT" >> $GITHUB_OUTPUT

      - name: Generate Coverage Badge JSON
        run: |
          echo "{
            \"schemaVersion\": 1,
            \"label\": \"coverage\",
            \"message\": \"${{ steps.coverage.outputs.coverage }}%\",
            \"color\": \"9C27B0\"
          }" > coverage-badge.json

      - name: Upload Coverage Badge to badges branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Fetch all remote branches
          git fetch origin

          # Check if 'badges' branch exists on remote
          if git ls-remote --exit-code origin badges; then
            echo "Badges branch exists. Checking out..."
            git checkout badges
          else
            echo "Badges branch does NOT exist. Creating it..."
            git checkout --orphan badges
            git rm -rf .
          fi

          cp coverage-badge.json coverage.json
          git add coverage.json

          git commit -m "Update coverage badge to ${{ steps.coverage.outputs.coverage }}%" || echo "No changes"
          git push origin badges --force

      # ---------------------------------------------
      # 🔥 10) Summary (always)
      # ---------------------------------------------
      - name: 🧾 Summary Report
        if: always()
        run: |
          echo "### 🧾 Repository Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "📦 Environment: $APP_ENV" >> $GITHUB_STEP_SUMMARY
          echo "🧱 Redis: $REDIS_HOST" >> $GITHUB_STEP_SUMMARY
          echo "🗄️ MySQL: $MYSQL_HOST" >> $GITHUB_STEP_SUMMARY
          echo "📁 Mongo: $MONGO_HOST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          tail -n 20 phpunit.log >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "FAILURES!" phpunit.log; then
            echo "❌ Some tests failed." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All tests passed successfully." >> $GITHUB_STEP_SUMMARY
          fi

          PHPSTAN_ERR=${{ steps.phpstan.outputs.phpstan_errors }}
          if [ "$PHPSTAN_ERR" -eq 0 ]; then
            echo "🧹 PHPStan: Passed (0 errors)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ PHPStan: $PHPSTAN_ERR errors" >> $GITHUB_STEP_SUMMARY
          fi
          echo "📊 Coverage: ${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------
      # 11) Telegram Notification
      # ---------------------------------------------
      - name: 📲 Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
        run: |
          START_TS=$(date -u -d "$GH_START_ISO" +%s)
          END_TS=$(date +%s)
          START_TIME=$(date -u -d "@$START_TS" +"%H:%M:%S UTC")
          END_TIME=$(date -u +"%H:%M:%S UTC")
          DURATION=$((END_TS - START_TS))

          if [ $DURATION -lt 60 ]; then
            DURATION_STR="${DURATION}s"
          else
            DURATION_STR="$(($DURATION / 60))m $(($DURATION % 60))s"
          fi

          STATUS="✅ Tests passed successfully!"
          COLOR="🟢"
          HEADER="Maatify CI Report ${GITHUB_REPOSITORY})"

          if grep -q "FAILURES!" phpunit.log || [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ Test or PHPStan failure!"
            COLOR="🔴"
            HEADER="Maatify CI Alert ${GITHUB_REPOSITORY}"
          fi

          PHPSTAN_ERR=${{ steps.phpstan.outputs.phpstan_errors }}
          if [ "$PHPSTAN_ERR" -eq 0 ]; then
            PHPSTAN_SUMMARY="🧹 <b>PHPStan:</b> Passed (0 errors)"
          else
            PHPSTAN_SUMMARY="🧹 <b>PHPStan:</b> ${PHPSTAN_ERR} errors"
          fi

          PROJECT="${GITHUB_REPOSITORY}"
          BRANCH="$GITHUB_REF_NAME"
          ACTOR="$GITHUB_ACTOR"
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE="📢 <b>${HEADER}</b>

          ${COLOR} ${STATUS}

          ${PHPSTAN_SUMMARY}

          📦 <b>Project:</b> ${PROJECT}
          🧱 <b>Branch:</b> ${BRANCH}
          👨‍💻 <b>By:</b> ${ACTOR}

          ⏱ <b>Start:</b> ${START_TIME}
          🕒 <b>End:</b> ${END_TIME}
          ⏳ <b>Duration:</b> ${DURATION_STR}

          🔗 <a href='${URL}'>View CI Logs</a>
          "

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" --arg pm "HTML" '{chat_id: $chat_id, text: $text, parse_mode: $pm}')"
